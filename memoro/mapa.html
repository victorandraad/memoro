<style>
:root {
  --bg: #edf0f2;
  --ink: #1c2630;
  --mute: #5e6b76;
  --line: #c9d1d8;
  --panel: #ffffff;
  --sel: #0e7c86;
  --herda-de: #a8326b;
  --herdado-por: #2f6f3e;
  --pendente: #c0392b;
  --ambiguo: #c08a2e;
  --aresta: #a8326b;
  --foco: #0e7c86;
  --gutter: 16px;
  --esmaece: 0.14;
  --orfao-alfa: 0.42;
  --area-alfa: 0.12;
  --sub-alfa: 0.2;
  --fato-s: 55%;
  --fato-l: 48%;
  --amostra: 210;
  --rotulo-s: 72%;
  --rotulo-l: 22%;
  --sombra: 0 1px 8px hsl(210 20% 20% / 0.12);
  --fs-1: 12px;
  --fs-2: 13px;
  --fs-3: 15px;
  --fs-4: 18px;
  --fs-5: 24px;
  --traco-pendente: 5 3;
  --traco-ambiguo: 2 2;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #10161c;
    --ink: #e3e8ec;
    --mute: #8c99a4;
    --line: #2b3640;
    --panel: #18212a;
    --sel: #4fc3cc;
    --herda-de: #e0689f;
    --herdado-por: #6fbf7a;
    --pendente: #e07070;
    --ambiguo: #e0b05a;
    --aresta: #e0689f;
    --foco: #4fc3cc;
    --fato-s: 60%;
    --fato-l: 62%;
    --rotulo-s: 52%;
    --rotulo-l: 80%;
    --sombra: 0 1px 10px hsl(210 30% 4% / 0.45);
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font-size: var(--fs-3);
  line-height: 1.45;
  padding: 12px var(--gutter);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
button, input, select { font-family: inherit; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
h1 { font-size: var(--fs-5); font-weight: 600; line-height: 1.15; margin: 0; }
#painel h2 { font-size: var(--fs-4); font-weight: 600; margin: 0; word-break: break-word; }
#saude { color: var(--mute); font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 4px 10px; }
#saude button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  text-decoration: underline;
}
#saude button[aria-pressed="true"] { color: var(--sel); font-weight: 600; }
#busca {
  margin-left: auto;
  font: inherit;
  padding: 6px 10px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  border-radius: 4px;
  min-width: 0;
  width: 220px;
}
#lentes { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
#lentes button, .zoom button, #painel .acoes a, #painel .acoes button, .liga {
  font: inherit;
  font-size: var(--fs-2);
  border: 1px solid var(--line);
  background: transparent;
  color: var(--mute);
  padding: 3px 10px;
  border-radius: 99px;
  cursor: pointer;
  white-space: nowrap;
}
#lentes button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
#legenda { color: var(--mute); font-size: var(--fs-2); }
#legenda summary { cursor: pointer; }
.itens-legenda {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  list-style: none;
  margin: 8px 0 0;
  padding: 0;
}
.am {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  vertical-align: middle;
  margin-right: 6px;
}
.am-fato { background: hsl(var(--amostra) var(--fato-s) var(--fato-l)); }
.am-area {
  background: hsl(var(--amostra) var(--fato-s) var(--fato-l) / var(--area-alfa));
  box-shadow: inset 0 0 0 1px hsl(var(--amostra) var(--fato-s) var(--fato-l));
}
.am-sub {
  background: hsl(var(--amostra) var(--fato-s) var(--fato-l) / var(--sub-alfa));
  box-shadow: inset 0 0 0 1px hsl(var(--amostra) var(--fato-s) var(--fato-l));
}
.am-uses, .am-link {
  width: 22px;
  height: 0;
  border-radius: 0;
  border-top: 2px solid var(--aresta);
}
.am-link { border-top-style: dashed; }
.am-sel { background: hsl(var(--amostra) var(--fato-s) var(--fato-l)); box-shadow: inset 0 0 0 2px var(--sel); }
.am-herda { background: hsl(var(--amostra) var(--fato-s) var(--fato-l)); box-shadow: inset 0 0 0 2px var(--herda-de); }
.am-herdado { background: hsl(var(--amostra) var(--fato-s) var(--fato-l)); box-shadow: inset 0 0 0 2px var(--herdado-por); }
.am-orfao { background: hsl(var(--amostra) var(--fato-s) var(--fato-l)); opacity: var(--orfao-alfa); }
.am-svg, .ico-estado {
  width: 14px;
  height: 14px;
  vertical-align: middle;
  margin-right: 6px;
  overflow: visible;
  flex: 0 0 14px;
}
.am-svg .fato, .ico-estado .fato { cursor: default; --matiz: var(--amostra); }
main { flex: 1; min-height: 0; position: relative; overflow: hidden; }
svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  user-select: none;
}
.zoom {
  position: absolute;
  left: 8px;
  top: 8px;
  display: flex;
  gap: 6px;
  z-index: 2;
}
.zoom button { background: var(--panel); color: var(--ink); border-radius: 4px; }
#painel {
  position: absolute;
  right: 0;
  top: 0;
  width: min(320px, 100%);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;

}

#painel .k:first-child { margin-top: 0; }
#painel p { margin: 0 0 8px; font-size: var(--fs-3); }
#painel .caminho { font-size: var(--fs-1); line-height: 1.4; overflow-wrap: anywhere; }
#painel .acoes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }

.liga { border-radius: 4px; color: var(--sel); padding: 2px 8px; }
.mute { color: var(--mute); }
.txt-pendente { color: var(--pendente); }
.txt-ambiguo { color: var(--ambiguo); }

.area, .subarea {
  fill: hsl(var(--matiz) var(--fato-s) var(--fato-l) / var(--area-alfa));
  stroke: hsl(var(--matiz) var(--fato-s) var(--fato-l));
  stroke-width: 1;
  cursor: pointer;
}
.subarea { fill: hsl(var(--matiz) var(--fato-s) var(--fato-l) / var(--sub-alfa)); }
.fato.orfao { fill-opacity: var(--orfao-alfa); }
.fato.ambiguo { stroke: var(--ambiguo); stroke-dasharray: var(--traco-ambiguo); stroke-width: 2.5; }
.fato.pendente { stroke: var(--pendente); stroke-dasharray: var(--traco-pendente); stroke-width: 2.5; }
.fato.herda-de, .area.herda-de, .subarea.herda-de { stroke: var(--herda-de); stroke-width: 2.5; }
.fato.herdado-por, .area.herdado-por, .subarea.herdado-por { stroke: var(--herdado-por); stroke-width: 2.5; }
.fato.sel, .area.sel, .subarea.sel { stroke: var(--sel); stroke-width: 3; }
.esmaecido { opacity: var(--esmaece); }
.aresta { fill: none; stroke: var(--aresta); stroke-width: 1.2; opacity: 0.45; pointer-events: none; }
.aresta.link { stroke-width: 0.7; stroke-dasharray: 3 3; }
.aresta.acesa { opacity: 1; stroke-width: 2.2; }
.aresta.acesa.link { stroke-width: 1.4; }
.aresta.esmaecido { opacity: 0.08; }
.rotulo {
  fill: var(--ink);
  text-anchor: middle;
  pointer-events: none;
  paint-order: stroke;
  stroke: var(--bg);
  stroke-width: 3px;
  font-weight: 600;
}
.rotulo.area, .rotulo.subarea {
  fill: hsl(var(--matiz) var(--rotulo-s) var(--rotulo-l));
  font-weight: 600;
}
.rotulo.area { text-transform: uppercase; letter-spacing: 0.04em; }
.rotulo.fato { font-weight: 400; }
:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
@media (max-width: 600px) {
  #busca { width: 100%; margin-left: 0; }
  header, #lentes, #legenda, main { max-width: 100%; }
  #painel {
    top: auto;
    bottom: 0;
    max-height: 45vh;
    overflow: auto;
    width: 100%;
    border-radius: 6px 6px 0 0;
  }
  #painel .acoes { flex-direction: column; }
  #painel .acoes a, #painel .acoes button { text-align: center; }
  .zoom { top: 8px; bottom: auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var LIMIAR_ARRASTO = 5;
  var PACK = 1000;
  var CX = 500;
  var CY = 500;
  var RETICENCIAS = "…";
  var RAIO_MIN_FATO = 11;
  var RAIO_MIN_AREA = 28;
  var RAIO_MIN_SUB = 22;
  var FONTE_FATO_MIN = 7;
  var FONTE_FATO_MAX = 13;
  var FONTE_AREA_MIN = 10;
  var FONTE_AREA_MAX = 15;
  var FONTE_SUB_MIN = 8;
  var FONTE_SUB_MAX = 12;
  var MAX_LINHAS = 3;
  var MARGEM_VISTA = 24;
  var COEF = 0.56;
  var _ctxMedida = null;

  function criar(tag, attrs) {
    var n = document.createElement(tag);
    var k;
    if (attrs) {
      for (k in attrs) {
        if (attrs[k] === null || attrs[k] === undefined) continue;
        if (k === "className") n.className = attrs[k];
        else n.setAttribute(k, attrs[k]);
      }
    }
    var i;
    for (i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null) continue;
      n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return n;
  }

  function svgEl(tag, attrs) {
    var n = document.createElementNS(NS, tag);
    var k;
    if (attrs) {
      for (k in attrs) {
        if (attrs[k] === null || attrs[k] === undefined) continue;
        n.setAttribute(k, String(attrs[k]));
      }
    }
    return n;
  }

  function tituloSvg(texto) {
    var t = document.createElementNS(NS, "title");
    t.textContent = texto;
    return t;
  }

  function fonteFamilia() {
    try {
      return getComputedStyle(document.body).fontFamily || "system-ui, sans-serif";
    } catch (e) {
      return "system-ui, sans-serif";
    }
  }

  function ctxMedida() {
    if (_ctxMedida) return _ctxMedida;
    try {
      _ctxMedida = document.createElement("canvas").getContext("2d");
    } catch (e) {
      _ctxMedida = null;
    }
    return _ctxMedida;
  }

  function medir(texto, fontePx, peso, caixaAlta) {
    var t = texto || "";
    if (caixaAlta) t = t.toUpperCase();
    var ctx = ctxMedida();
    if (ctx) {
      ctx.font = (peso || 400) + " " + fontePx + "px " + fonteFamilia();
      var w = ctx.measureText(t).width;
      if (caixaAlta) w *= 1.04;
      return w;
    }
    return t.length * fontePx * COEF * (caixaAlta ? 1.04 : 1);
  }

  function corda(r, dy, margem) {
    var ri = Math.max(0, r - (margem || 0));
    var d = Math.abs(dy);
    if (d >= ri) return 0;
    return 2 * Math.sqrt(ri * ri - d * d);
  }

  function pecasDoNome(nome) {
    var pecas = [], buf = "", i, ch;
    nome = nome || "";
    for (i = 0; i < nome.length; i++) {
      ch = nome.charAt(i);
      if (ch === "-" || ch === "/") {
        if (buf) pecas.push(buf);
        pecas.push(ch);
        buf = "";
      } else buf += ch;
    }
    if (buf) pecas.push(buf);
    return pecas.length ? pecas : [nome];
  }

  function juntarPecas(pecas, a, b) {
    var s = "", i;
    for (i = a; i < b; i++) s += pecas[i];
    return s;
  }

  function encurtar(texto, maxPx, fontePx, peso, caixaAlta) {
    if (!texto) return "";
    if (medir(texto, fontePx, peso, caixaAlta) <= maxPx) return texto;
    var i, s;
    for (i = texto.length - 1; i >= 1; i--) {
      s = texto.slice(0, i) + RETICENCIAS;
      if (medir(s, fontePx, peso, caixaAlta) <= maxPx) return s;
    }
    return RETICENCIAS;
  }

  function pularSep(pecas, i) {
    while (i < pecas.length && (pecas[i] === "-" || pecas[i] === "/")) i++;
    return i;
  }

  function empacotar(nome, nLinhas, larguras, fontePx, ellipsis, peso, caixaAlta) {
    var pecas = pecasDoNome(nome);
    var linhas = [];
    var i = 0, L, j, cand, last;
    peso = peso || 400;
    caixaAlta = !!caixaAlta;
    for (L = 0; L < nLinhas; L++) {
      i = pularSep(pecas, i);
      if (i >= pecas.length) break;
      if (L === nLinhas - 1) {
        cand = juntarPecas(pecas, i, pecas.length);
        if (medir(cand, fontePx, peso, caixaAlta) <= larguras[L]) {
          linhas.push(cand);
          i = pecas.length;
        } else if (ellipsis) {
          linhas.push(encurtar(cand, larguras[L], fontePx, peso, caixaAlta));
          i = pecas.length;
        } else return null;
      } else {
        last = -1;
        for (j = i + 1; j <= pecas.length; j++) {
          cand = juntarPecas(pecas, i, j);
          if (medir(cand, fontePx, peso, caixaAlta) <= larguras[L]) last = j;
          else break;
        }
        if (last > i && (pecas[last - 1] === "-" || pecas[last - 1] === "/") && last - 1 > i) last--;
        if (last <= i) {
          if (!ellipsis) return null;
          linhas.push(encurtar(pecas[i], larguras[L], fontePx, peso, caixaAlta));
          i = pularSep(pecas, i + 1);
          continue;
        }
        linhas.push(juntarPecas(pecas, i, last));
        i = last;
      }
    }
    if (i < pecas.length) return ellipsis ? linhas : null;
    return linhas.length ? linhas : null;
  }

  function linhasNoDisco(nome, n, rTela, fs, lh, margem, ellipsis, peso, caixaAlta) {
    var dys = [], larguras = [], i, dy;
    for (i = 0; i < n; i++) {
      dy = (i - (n - 1) / 2) * lh;
      dys.push(dy);
      larguras.push(corda(rTela, dy, margem));
    }
    var linhas = empacotar(nome, n, larguras, fs, ellipsis, peso, caixaAlta);
    if (!linhas) return null;
    return { fs: fs, linhas: linhas, dys: dys, lh: lh };
  }

  function layoutFato(nome, rTela) {
    if (rTela < RAIO_MIN_FATO) return null;
    var margem = Math.max(2, Math.min(4, rTela * 0.08));
    var fs, n, lh, achado;
    for (fs = FONTE_FATO_MAX; fs >= FONTE_FATO_MIN - 0.01; fs -= 0.5) {
      lh = fs * 1.08;
      for (n = 1; n <= MAX_LINHAS; n++) {
        if (n * lh > 2 * (rTela - margem)) continue;
        achado = linhasNoDisco(nome, n, rTela, fs, lh, margem, false, 400, false);
        if (achado) return achado;
      }
    }
    fs = FONTE_FATO_MIN;
    lh = fs * 1.08;
    for (n = MAX_LINHAS; n >= 1; n--) {
      if (n * lh > 2 * (rTela - margem)) continue;
      achado = linhasNoDisco(nome, n, rTela, fs, lh, margem, true, 400, false);
      if (achado) return achado;
    }
    return null;
  }

  function anelUser(pack) {
    var ch = pack.children || [];
    var i, d, max = 0;
    for (i = 0; i < ch.length; i++) {
      d = Math.hypot(ch[i].x - pack.x, ch[i].y - pack.y) + ch[i].r;
      if (d > max) max = d;
    }
    if (!max) return pack.r * 0.16;
    return Math.max(0, pack.r - max);
  }

  function layoutGrupo(nome, rTela, anelTela, tipo) {
    var fsMin = tipo === "area" ? FONTE_AREA_MIN : FONTE_SUB_MIN;
    var fsMax = tipo === "area" ? FONTE_AREA_MAX : FONTE_SUB_MAX;
    var rMin = tipo === "area" ? RAIO_MIN_AREA : RAIO_MIN_SUB;
    var caixa = tipo === "area";
    var peso = 600;
    var fs, n, lh, dy, maxW, t, i, dys, larguras, linhas, fromEdge, arcLen, rArc, abertura;
    if (rTela < rMin) return null;
    abertura = tipo === "area" ? 2.5 : 2.2;
    rArc = rTela - Math.max(4, Math.min(anelTela * 0.45, fsMax * 0.7));
    arcLen = Math.max(0, rArc * abertura);
    if (rTela >= 40 && arcLen >= 28) {
      for (fs = fsMax; fs >= fsMin - 0.01; fs -= 0.5) {
        if (medir(nome, fs, peso, caixa) <= arcLen * 0.94) {
          return { fs: fs, texto: nome, curvo: true, abertura: abertura };
        }
      }
      t = encurtar(nome, arcLen * 0.94, fsMin, peso, caixa);
      if (t && t !== RETICENCIAS) {
        return { fs: fsMin, texto: t, curvo: true, abertura: abertura };
      }
    }
    for (fs = fsMax; fs >= fsMin - 0.01; fs -= 0.5) {
      lh = fs * 1.08;
      for (n = 1; n <= 2; n++) {
        if (n * lh > Math.max(anelTela, rTela * 0.35)) continue;
        fromEdge = Math.max(fs * 0.55, (anelTela - n * lh) * 0.5 + fs * 0.35);
        dys = [];
        larguras = [];
        for (i = 0; i < n; i++) {
          dy = -(rTela - fromEdge) + i * lh;
          dys.push(dy);
          larguras.push(corda(rTela, dy, 3));
        }
        linhas = empacotar(nome, n, larguras, fs, false, peso, caixa);
        if (linhas) return { fs: fs, texto: null, linhas: linhas, dys: dys, lh: lh, curvo: false };
      }
    }
    fs = fsMin;
    lh = fs * 1.08;
    fromEdge = Math.max(fs * 0.55, fs * 0.7);
    dy = -(rTela - fromEdge);
    maxW = corda(rTela, dy, 3);
    t = encurtar(nome, maxW, fs, peso, caixa);
    if (!t || t === RETICENCIAS) return null;
    return { fs: fs, texto: t, dy: dy, curvo: false };
  }

  function limparFilhos(el) {

    this.painel = document.getElementById("painel");
    this.saudeEl = document.getElementById("saude");
    this.lentesEl = document.getElementById("lentes");

    this.arestasEl = [];

  Mapa.prototype.iniciar = function () {

  Mapa.prototype.ligarEventos = function () {

    this.svg.addEventListener("pointermove", function (e) { self.aoPointerMove(e); });
    this.svg.addEventListener("pointerup", function (e) { self.aoPointerUp(e); });
    this.svg.addEventListener("pointercancel", function (e) { self.aoPointerUp(e); });
    this.svg.addEventListener("wheel", function (e) {
      e.preventDefault();
      self.ajusteManual = true;
      var fator = Math.pow(1.0016, -e.deltaY);

      e.stopPropagation();
      if (self.bloquearClique) {

        e.preventDefault();
        return;
      }

    });
    document.getElementById("zoom-mais").addEventListener("click", function () {
      self.zoomCentro(self.escala * 1.25);
    });
    document.getElementById("zoom-menos").addEventListener("click", function () {
      self.zoomCentro(self.escala / 1.25);
    });
    document.getElementById("centralizar").addEventListener("click", function () {

  Mapa.prototype.desenhar = function (dados, preservar) {
    var focoId = preservar && this.foco ? this.foco.id : null;
    var focoTipo = preservar && this.foco ? this.foco.tipo : null;
    var lente = preservar ? this.lente : null;
    var prevK = this.escala, prevTx = this.tx, prevTy = this.ty, prevManual = this.ajusteManual;
    this.dados = dados;
    if (lente && !(lente in dados.lentes)) lente = null;
    this.lente = lente;
    var self = this;
    this.indice = {};
    this.discos = [];
    this.arestasEl = [];
    this.rotulos = [];
    this.destacados = new Set();
    this.foco = null;

    while (this.svg.firstChild) this.svg.removeChild(this.svg.firstChild);
    this.grupo = svgEl("g");
    this.svg.appendChild(this.grupo);
    this.aplicarTransform();

    var arvore = this.montarArvore(dados);
    var hierarquia = d3.hierarchy(arvore, function (d) { return d.filhos; })
      .sum(function (d) { return d.value || 0; })
      .sort(function (a, b) { return b.value - a.value; });
    d3.pack().size([PACK, PACK]).padding(function (d) {
      if (d.depth === 0) return 12;
      if (d.depth === 1) return 16;
      return 10;

    var nosPack = hierarquia.descendants().slice(1);
    var i, p, d, circ, txt, path, a, b, mx, my, origem, destino;
    var porIdPack = {};

    for (i = 0; i < nosPack.length; i++) {
      p = nosPack[i];
      d = p.data;
      circ = svgEl("circle", {
        cx: p.x,
        cy: p.y,
        r: p.r,
        class: d.tipo,
        "data-tipo": d.tipo,
        "data-id": d.id
      });
      circ.style.setProperty("--matiz", String(d.matiz));
      circ.appendChild(tituloSvg(
        d.tipo === "fato" ? (d.rotulo || d.nome) : (d.tipo === "subarea" ? d.id : d.nome)
      ));
      if (d.tipo === "fato") {
        if (d.orfao) circ.classList.add("orfao");
        if (d.ambiguos && d.ambiguos.length) circ.classList.add("ambiguo");
        if (d.pendentes && d.pendentes.length) circ.classList.add("pendente");
        circ.setAttribute("tabindex", "0");
        circ.setAttribute("role", "button");
        circ.setAttribute("aria-label", d.rotulo || d.nome);
        circ.addEventListener("keydown", (function (id) {
          return function (e) {

        this.indice[d.id] = d;

      this.discos.push({ el: circ, pack: p, dado: d });

    for (i = 0; i < dados.arestas.length; i++) {
      a = dados.arestas[i];
      origem = porIdPack[a.origem];
      destino = porIdPack[a.destino];
      if (!origem || !destino) continue;
      mx = (origem.x + destino.x) / 2;
      my = (origem.y + destino.y) / 2;
      path = svgEl("path", {
        class: "aresta " + a.tipo,
        d: "M" + origem.x + "," + origem.y +
          " Q" + (mx + (CX - mx) * 0.35) + "," + (my + (CY - my) * 0.35) +

      this.arestasEl.push({ el: path, aresta: a });

    for (i = 0; i < nosPack.length; i++) {
      p = nosPack[i];
      d = p.data;
      var arco = null;
      if (d.tipo === "area" || d.tipo === "subarea") {

          id: "m-arco-" + i,
          fill: "none",
          stroke: "none",
          "pointer-events": "none"

        this.grupo.appendChild(arco);

      txt = svgEl("text", {
        class: "rotulo " + d.tipo,
        x: p.x,
        y: p.y

      txt.style.setProperty("--matiz", String(d.matiz));
      this.grupo.appendChild(txt);
      this.rotulos.push({

        arco: arco,
        arcoId: arco ? "m-arco-" + i : null,
        pack: p,
        tipo: d.tipo,
        nome: d.tipo === "fato" ? (d.rotulo || d.nome) : (d.tipo === "subarea" ? d.id : d.nome)

    this.preencherLentes(dados.lentes);

    if (focoTipo === "fato" && this.indice[focoId]) this.selecionarPorId(focoId);
    else if (focoId) {
      for (i = 0; i < this.discos.length; i++) {

      this.tx = prevTx;
      this.ty = prevTy;

  };

  Mapa.prototype.montarArvore = function (dados) {
    var areas = {};
    var raiz = { nome: "raiz", tipo: "raiz", filhos: [] };
    var i, a, fato, pai, sub, area;
    for (i = 0; i < dados.areas.length; i++) {
      a = dados.areas[i];
      area = {
        nome: a.nome,
        tipo: "area",
        id: a.nome,
        area: a.nome,
        matiz: a.matiz,
        filhos: [],
        subs: {}
      };
      areas[a.nome] = area;
      raiz.filhos.push(area);
    }
    for (i = 0; i < dados.nos.length; i++) {
      fato = dados.nos[i];
      area = areas[fato.area];
      if (!area) continue;
      pai = area;
      if (fato.subarea) {
        sub = area.subs[fato.subarea];
        if (!sub) {
          sub = {
            nome: fato.subarea,
            tipo: "subarea",
            id: fato.area + "/" + fato.subarea,
            area: fato.area,
            subarea: fato.subarea,
            matiz: area.matiz,
            filhos: []
          };
          area.subs[fato.subarea] = sub;
          area.filhos.push(sub);
        }
        pai = sub;
      }
      pai.filhos.push({
        id: fato.id,
        nome: fato.nome,
        rotulo: fato.rotulo,
        descricao: fato.descricao,
        area: fato.area,
        subarea: fato.subarea,
        caminho: fato.caminho,
        pendentes: fato.pendentes || [],
        ambiguos: fato.ambiguos || [],
        orfao: !!fato.orfao,
        tipo: "fato",
        matiz: area.matiz,
        value: 1

    }
    return raiz;

  Mapa.prototype.aplicarTransform = function () {

  Mapa.prototype.metricaSvg = function () {

      w: w,
      h: h,
      s: s,
      ox: (w - this.packW * s) / 2,
      oy: (h - this.packH * s) / 2,
      left: r.left,
      top: r.top

  };

  Mapa.prototype.gavetaEmbaixo = function () {

  Mapa.prototype.rectVisivel = function () {

        if (topPainel < vis.h) vis.h = Math.max(48, topPainel);
      } else {
        var leftPainel = p.left - svg.left;
        if (leftPainel > vis.w * 0.3 && leftPainel < vis.w) vis.w = Math.max(48, leftPainel);

    vis.y += MARGEM_VISTA;

  Mapa.prototype.enquadrarPacote = function () {

  Mapa.prototype.garantirVisivel = function (pack) {

  Mapa.prototype.pontoSvg = function (clientX, clientY) {

  Mapa.prototype.zoomEm = function (clientX, clientY, nova) {

  Mapa.prototype.tratarClique = function (el) {

  Mapa.prototype.limpar = function () {

    this.aplicarFiltros();
    this.atualizarRotulos();
  };

  Mapa.prototype.fecharPainel = function () {

  };

  Mapa.prototype.naLente = function (no) {

    var i, escopo, chaveSub;
    chaveSub = no.subarea ? no.area + "/" + no.subarea : null;
    for (i = 0; i < escopos.length; i++) {
      escopo = escopos[i];
      if (no.tipo === "area") {
        if (escopo === no.area || escopo.indexOf(no.area + "/") === 0) return true;
      } else if (no.tipo === "subarea") {
        if (escopo === no.area || escopo === no.area + "/" + no.nome) return true;
      } else {
        if (escopo === no.area) return true;
        if (chaveSub && escopo === chaveSub) return true;

  };

  Mapa.prototype.casaBusca = function (no, q) {

  };

  Mapa.prototype.vizinhosDoFoco = function () {
    var herdaDe = new Set();
    var herdadoPor = new Set();
    var id = this.foco && this.foco.tipo === "fato" ? this.foco.id : null;
    var i, a;
    if (!id) return { herdaDe: herdaDe, herdadoPor: herdadoPor, ids: new Set() };
    for (i = 0; i < this.dados.arestas.length; i++) {
      a = this.dados.arestas[i];
      if (a.origem === id) herdaDe.add(a.destino);
      else if (a.destino === id) herdadoPor.add(a.origem);
    }
    var ids = new Set([id]);
    herdaDe.forEach(function (x) { ids.add(x); });
    herdadoPor.forEach(function (x) { ids.add(x); });
    return { herdaDe: herdaDe, herdadoPor: herdadoPor, ids: ids };
  };

  Mapa.prototype.aplicarFiltros = function () {
    var q = this.busca.value.trim().toLowerCase();
    var viz = this.vizinhosDoFoco();
    var fatoSel = this.foco && this.foco.tipo === "fato";
    this.destacados = viz.ids;
    var i, item, d, el, dim;
    for (i = 0; i < this.discos.length; i++) {
      item = this.discos[i];
      d = item.dado;
      el = item.el;
      el.classList.remove("sel", "herda-de", "herdado-por", "esmaecido");
      dim = false;
      if (!this.naLente(d)) dim = true;
      if (!this.casaBusca(d, q)) dim = true;
      if (this.filtroSaude === "pendentes" && d.tipo === "fato" && !(d.pendentes && d.pendentes.length)) dim = true;
      if (this.filtroSaude === "ambiguos" && d.tipo === "fato" && !(d.ambiguos && d.ambiguos.length)) dim = true;
      if (fatoSel && d.tipo === "fato" && !viz.ids.has(d.id)) dim = true;
      if (fatoSel && d.tipo === "fato" && viz.ids.has(d.id)) dim = false;
      if (this.foco && d === this.foco) {
        el.classList.add("sel");
        dim = false;
      } else if (fatoSel && d.tipo === "fato") {
        if (viz.herdaDe.has(d.id)) el.classList.add("herda-de");
        if (viz.herdadoPor.has(d.id)) el.classList.add("herdado-por");
      }
      if (dim) el.classList.add("esmaecido");
      item.dim = dim;
    }
    for (i = 0; i < this.rotulos.length; i++) {
      item = this.rotulos[i];
      dim = false;
      for (var j = 0; j < this.discos.length; j++) {
        if (this.discos[j].pack === item.pack) { dim = this.discos[j].dim; break; }
      }
      item.el.classList.toggle("esmaecido", !!dim);
    }
    for (i = 0; i < this.arestasEl.length; i++) {
      item = this.arestasEl[i];
      el = item.el;
      el.classList.remove("acesa", "esmaecido");
      if (fatoSel) {
        if (item.aresta.origem === this.foco.id || item.aresta.destino === this.foco.id) el.classList.add("acesa");
        else el.classList.add("esmaecido");
      }
    }
  };

  Mapa.prototype.pedirRotulos = function () {
    var self = this;
    if (this.rafRotulos) return;
    this.rafRotulos = requestAnimationFrame(function () {
      self.rafRotulos = 0;
      self.atualizarRotulos();
    });
  };

  Mapa.prototype.atualizarRotulos = function () {
    var m = this.metricaSvg();
    var k = this.escala;
    var s = m.s;
    var ks = k * s || 0.001;
    var stroke = 2.2 / ks;
    var i, r, d, raioTela, layout, dest, anelTela, fonteUser, lhUser, j, ts, tp, rArc;
    for (i = 0; i < this.rotulos.length; i++) {
      r = this.rotulos[i];
      d = r.pack.data;
      raioTela = r.pack.r * ks;
      dest = r.tipo === "fato" && this.destacados.has(d.id);
      if (r.tipo === "area" || r.tipo === "subarea") {
        anelTela = anelUser(r.pack) * ks;
        layout = layoutGrupo(r.nome, raioTela, anelTela, r.tipo);
        if (!layout) {
          r.el.style.display = "none";
          limparFilhos(r.el);
          if (r.arco) r.arco.style.display = "none";
          continue;
        }
        fonteUser = layout.fs / ks;
        r.el.setAttribute("font-size", fonteUser);
        r.el.setAttribute("stroke-width", stroke);
        r.el.setAttribute("font-weight", "600");
        r.el.style.display = "";
        limparFilhos(r.el);
        if (layout.curvo && r.arco && r.arcoId) {
          rArc = Math.max(4, r.pack.r - Math.max(anelUser(r.pack) * 0.4, fonteUser * 0.65));
          r.arco.setAttribute("d", arcoTopo(r.pack.x, r.pack.y, rArc, layout.abertura || 2.4));
          r.arco.style.display = "";
          r.el.removeAttribute("x");
          r.el.removeAttribute("y");
          tp = document.createElementNS(NS, "textPath");
          tp.setAttribute("href", "#" + r.arcoId);
          tp.setAttributeNS("http://www.w3.org/1999/xlink", "xlink:href", "#" + r.arcoId);
          tp.setAttribute("startOffset", "50%");
          tp.setAttribute("text-anchor", "middle");
          tp.setAttribute("dy", String(fonteUser * 0.4));
          tp.textContent = layout.texto;
          r.el.appendChild(tp);
        } else {
          if (r.arco) r.arco.style.display = "none";
          r.el.setAttribute("dominant-baseline", "middle");
          if (layout.linhas && layout.linhas.length) {
            lhUser = layout.lh / ks;
            r.el.setAttribute("x", r.pack.x);
            r.el.setAttribute("y", r.pack.y + layout.dys[0] / ks);
            for (j = 0; j < layout.linhas.length; j++) {
              ts = document.createElementNS(NS, "tspan");
              ts.setAttribute("x", r.pack.x);
              ts.setAttribute("dy", j === 0 ? 0 : lhUser);
              ts.textContent = layout.linhas[j];
              r.el.appendChild(ts);
            }
          } else {
            r.el.setAttribute("x", r.pack.x);
            r.el.setAttribute("y", r.pack.y + layout.dy / ks);
            r.el.textContent = layout.texto;
          }
        }
      } else {
        if (!dest && r.el.classList.contains("esmaecido")) {
          r.el.style.display = "none";
          limparFilhos(r.el);
          continue;
        }
        layout = layoutFato(r.nome, raioTela);
        if (!layout) {
          r.el.style.display = "none";
          limparFilhos(r.el);
          continue;
        }
        fonteUser = layout.fs / ks;
        lhUser = layout.lh / ks;
        r.el.setAttribute("font-size", fonteUser);
        r.el.setAttribute("stroke-width", stroke);
        r.el.setAttribute("dominant-baseline", "middle");
        r.el.setAttribute("x", r.pack.x);
        r.el.setAttribute("y", r.pack.y + layout.dys[0] / ks);
        r.el.style.display = "";
        limparFilhos(r.el);
        for (j = 0; j < layout.linhas.length; j++) {
          ts = document.createElementNS(NS, "tspan");
          ts.setAttribute("x", r.pack.x);
          ts.setAttribute("dy", j === 0 ? 0 : lhUser);
          ts.textContent = layout.linhas[j];
          r.el.appendChild(ts);
        }
      }
    }
  };

  Mapa.prototype.aoBuscar = function () {
    var q = this.busca.value.trim().toLowerCase();
    var i, n, primeiro = null;
    if (!q) {
      this.aplicarFiltros();
      this.atualizarRotulos();
      if (!this.foco) this.ajudaPainel();
      return;
    }
    for (i = 0; i < this.dados.nos.length; i++) {
      n = this.dados.nos[i];
      if ((n.nome || "").toLowerCase().indexOf(q) !== -1 ||
          (n.rotulo || "").toLowerCase().indexOf(q) !== -1) {
        primeiro = this.indice[n.id] || n;
        break;
      }
    }
    this.aplicarFiltros();
    this.atualizarRotulos();
    if (primeiro) this.mostrarPainel(primeiro);
    else this.ajudaPainel();
  };

  Mapa.prototype.preencherSaude = function (saude) {
    var self = this;
    function item(nome, n) {
      return criar("span", null, n + " " + nome);
    }
    function botao(nome, n, filtro) {
      var b = criar("button", {
        type: "button",
        "aria-pressed": self.filtroSaude === filtro ? "true" : "false"
      }, n + " " + nome);
      b.addEventListener("click", function () {
        self.filtroSaude = self.filtroSaude === filtro ? null : filtro;
        self.preencherSaude(self.dados.saude);
        self.aplicarFiltros();
        self.atualizarRotulos();
      });
      return b;
    }
    this.saudeEl.replaceChildren(
      item("fatos", saude.fatos),
      item("áreas", saude.areas),
      botao("pendentes", saude.pendentes, "pendentes"),
      botao("ambíguos", saude.ambiguos, "ambiguos"),
      item("órfãos", saude.orfaos)
    );
  };

  Mapa.prototype.preencherLentes = function (lentes) {
    var self = this;
    var nomes = Object.keys(lentes);
    this.lentesEl.replaceChildren();
    nomes.forEach(function (nome) {
      var b = criar("button", {
        type: "button",
        "aria-pressed": self.lente === nome ? "true" : "false"
      }, nome);
      b.addEventListener("click", function () {
        self.lente = self.lente === nome ? null : nome;
        var i, filhos = self.lentesEl.children;
        for (i = 0; i < filhos.length; i++) {
          filhos[i].setAttribute("aria-pressed", filhos[i].textContent === self.lente ? "true" : "false");
        }
        self.aplicarFiltros();
        self.atualizarRotulos();
      });
      self.lentesEl.appendChild(b);
    });
  };

  Mapa.prototype.ajudaPainel = function () {
    this.painel.hidden = false;
    this.painel.replaceChildren(
      criar("div", { className: "k" }, "como ler"),
      criar("p", null, "Círculo grande é área, médio é subárea, ponto é fato. Linha cheia é herança (uses); pontilhada é link. Toque num fato: a cor de seleção é dele, uma cor é de quem herda ou aponta, outra é de quem herda dele ou aponta pra ele.")
    );
    this.pedirAjuste();
  };

  Mapa.prototype.iconeEstado = function (classe) {
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "ico-estado");
    svg.setAttribute("viewBox", "0 0 14 14");
    svg.setAttribute("width", "14");
    svg.setAttribute("height", "14");
    svg.setAttribute("aria-hidden", "true");
    var c = document.createElementNS(NS, "circle");
    c.setAttribute("class", "fato " + classe);
    c.setAttribute("cx", "7");
    c.setAttribute("cy", "7");
    c.setAttribute("r", "5");
    c.style.setProperty("--matiz", "210");
    svg.appendChild(c);
    return svg;
  };

  Mapa.prototype.mostrarPainel = function (no) {
    if (!no) {
      this.ajudaPainel();
      return;
    }
    var tipoNome = no.tipo === "fato" ? "fato" : no.tipo === "subarea" ? "subárea" : "área";
    var onde = no.area + (no.subarea ? "/" + no.subarea : "");
    var filhos = [
      criar("div", { className: "k" }, tipoNome + " · " + onde),
      criar("h2", null, no.tipo === "fato" ? no.rotulo : no.nome)
    ];
    if (no.descricao) {
      filhos.push(criar("div", { className: "k" }, "descrição"));
      filhos.push(criar("p", null, no.descricao));
    }
    if (no.tipo === "fato") {
      filhos.push(criar("div", { className: "k" }, "caminho"));
      filhos.push(criar("p", { className: "caminho" }, no.caminho));
      filhos.push(this.acoesDoFato(no));
      filhos.push(this.listaRelacoes(no));
    }
    this.painel.hidden = false;
    this.painel.replaceChildren.apply(this.painel, filhos);
    this.pedirAjuste();
  };

  Mapa.prototype.acoesDoFato = function (no) {
    var wrap = criar("div", { className: "acoes" });
    var abs = (this.dados.raiz ? this.dados.raiz + "/" : "") + no.caminho;
    var copiar = criar("button", { type: "button", "data-copy": abs }, "copiar caminho");
    var editor = (this.dados.esquema_do_editor || "vscode") + "://file/" + abs;
    var abrirEd = criar("a", { href: editor }, "abrir no editor");
    wrap.appendChild(copiar);
    wrap.appendChild(abrirEd);
    if (this.dados.url_base_de_edicao) {
      wrap.appendChild(criar("a", {
        href: this.dados.url_base_de_edicao + "/" + no.caminho
      }, "abrir na web"));
    }
    return wrap;
  };

  Mapa.prototype.listaRelacoes = function (no) {
    var wrap = criar("div");
    var herda = [];
    var herdado = [];
    var links = [];
    var i, a;
    for (i = 0; i < this.dados.arestas.length; i++) {
      a = this.dados.arestas[i];
      if (a.tipo === "uses" && a.origem === no.id) herda.push(a.destino);
      else if (a.tipo === "uses" && a.destino === no.id) herdado.push(a.origem);
      else if (a.tipo === "link" && a.origem === no.id) links.push(a.destino);
      else if (a.tipo === "link" && a.destino === no.id) links.push(a.origem);
    }
    wrap.appendChild(this.blocoIds("herda de", herda, null));
    wrap.appendChild(this.blocoIds("herdado por", herdado, null));
    wrap.appendChild(this.blocoIds("links", links, null));
    wrap.appendChild(this.blocoPendentes(no.pendentes || []));
    wrap.appendChild(this.blocoAmbiguos(no.ambiguos || []));
    return wrap;
  };

  Mapa.prototype.blocoIds = function (titulo, ids, classe) {
    var wrap = criar("div", { className: classe || "" });
    wrap.appendChild(criar("div", { className: "k" }, titulo));
    if (!ids.length) {
      wrap.appendChild(criar("p", { className: "mute" }, "nenhum"));
      return wrap;
    }
    var ul = criar("ul");
    var i, id, rotulo, no;
    for (i = 0; i < ids.length; i++) {
      id = ids[i];
      no = this.indice[id];
      rotulo = no ? no.rotulo : id;
      ul.appendChild(criar("li", null, criar("button", {
        type: "button",
        className: "liga",
        "data-id": id
      }, rotulo)));
    }
    wrap.appendChild(ul);
    return wrap;
  };

  Mapa.prototype.blocoPendentes = function (refs) {
    var wrap = criar("div", { className: "txt-pendente" });
    wrap.appendChild(criar("div", { className: "k" }, this.iconeEstado("pendente"), "referência pendente"));
    if (!refs.length) {
      wrap.appendChild(criar("p", { className: "mute" }, "nenhum"));
      return wrap;
    }
    var ul = criar("ul");
    var i;
    for (i = 0; i < refs.length; i++) ul.appendChild(criar("li", null, refs[i]));
    wrap.appendChild(ul);
    return wrap;
  };

  Mapa.prototype.blocoAmbiguos = function (lista) {
    var wrap = criar("div", { className: "txt-ambiguo" });
    wrap.appendChild(criar("div", { className: "k" }, this.iconeEstado("ambiguo"), "referência ambígua"));
    if (!lista.length) {
      wrap.appendChild(criar("p", { className: "mute" }, "nenhum"));
      return wrap;
    }
    var ul = criar("ul");
    var i, j, item, li, cand;
    for (i = 0; i < lista.length; i++) {
      item = lista[i];
      li = criar("li", null, item.ref + ": ");
      cand = item.candidatos || [];
      for (j = 0; j < cand.length; j++) {
        if (j) li.appendChild(document.createTextNode(" "));
        li.appendChild(criar("button", {
          type: "button",
          className: "liga",
          "data-id": cand[j]
        }, (this.indice[cand[j]] && this.indice[cand[j]].rotulo) || cand[j]));
      }
      ul.appendChild(li);
    }
    wrap.appendChild(ul);
    return wrap;
  };

  Mapa.prototype.aoCliquePainel = function (e) {
    var t = e.target;
    if (t && t.getAttribute && t.getAttribute("data-copy") !== null) {
      this.copiar(t.getAttribute("data-copy"), t);
      return;
    }
    var btn = t && t.closest ? t.closest("[data-id]") : null;
    if (btn && btn.getAttribute("data-id")) this.selecionarPorId(btn.getAttribute("data-id"));
  };

  Mapa.prototype.copiar = function (texto, botao) {
    // http nao e contexto seguro: navigator.clipboard some
    var original = botao.textContent;
    function fim(ok) {
      botao.textContent = ok ? "copiado" : "falhou";
      setTimeout(function () { botao.textContent = original; }, 1500);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(function () { fim(true); }).catch(function () {
        fim(copiarFallback(texto));
      });
    } else fim(copiarFallback(texto));
  };

  function copiarFallback(texto) {
    var x = document.createElement("textarea");
    x.value = texto;
    x.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(x);
    x.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    x.remove();
    return ok;
  }

  Mapa.prototype.iniciarPoll = function () {
    if (location.protocol.indexOf("http") !== 0) return;
    var self = this;
    var ms = Math.max(1, this.dados.intervalo_s || 30) * 1000;
    setInterval(function () { self.buscarAtualizacao(); }, ms);
  };

  Mapa.prototype.buscarAtualizacao = function () {
    var self = this;
    var cabecalhos = { "If-None-Match": this.etag };
    fetch("data.json", { cache: "no-cache", headers: cabecalhos }).then(function (r) {
      if (r.status !== 200) return null;
      self.etag = r.headers.get("ETag") || "";
      return r.text();
    }).then(function (t) {
      if (t == null || t === self.textoJson) return;
      self.textoJson = t;
      self.desenhar(JSON.parse(t), true);
    }).catch(function (e) {
      console.warn("mapa: fetch falhou", e);
    });
  };

  var mapa = new Mapa(JSON.parse(document.getElementById("dados").textContent));
  mapa.iniciar();
})();
</script>
