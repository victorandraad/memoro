[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memoro"
version = "0.1.0"
description = "Markdown facts with a single write gate, ids per area, and recall by lens."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
memoro = "memoro.cli:main"

[tool.setuptools]
packages = ["memoro"]

[tool.setuptools.package-data]
memoro = ["mapa.html", "d3-hierarchy.min.js"]
